<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager login · TaskAssigner+</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body><main class="login"><section class="card panel"><p class="eyebrow">TaskAssigner+</p><h1>Manager login</h1><p class="muted">Local development demo only.</p>{% if error %}<p class="alert error">{{ error }}</p>{% endif %}<form method="post" action="/auth/login"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="name" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button" type="submit">Sign in</button></form><p class="demo-hint"><strong>Demo:</strong> <code>demo-manager</code> / <code>DemoPass123!</code></p></section></main></body></html>
