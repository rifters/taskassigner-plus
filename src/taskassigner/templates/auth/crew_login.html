<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crew login · TaskAssigner+</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head><body><main class="login"><section class="card panel"><p class="eyebrow">TaskAssigner+</p><h1>Crew login</h1><p class="muted">Use your name and crew PIN.</p>{% if error %}<p class="alert error">{{ error }}</p>{% endif %}<form method="post" action="/auth/login-crew"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" autocomplete="username" required></label><label>PIN<input type="password" name="pin" inputmode="numeric" autocomplete="current-password" required></label><button class="button" type="submit">Sign in</button></form></section></main></body></html>
